
# Codecov configuration.
# See https://docs.codecov.com/docs/codecov-yaml for the full reference.

coverage:
  precision: 2
  round: down
  range: "80...100"

  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: false
    patch:
      default:
        target: auto
        threshold: 5%
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "dist/**/*"
  - "test/**/*"
  - "scripts/**/*"
  - "docs/**/*"
  - "**/*.d.ts"
