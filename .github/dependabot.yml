
version: 2

updates:
  # npm dependencies (devDependencies only - the published package has none).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
    # typescript-eslint still requires typescript <6.1.0 (TS7 is Go-native,
    # no stable programmatic API until 7.1). Block TS>=7 so `npm ci` keeps
    # passing; remove once typescript-eslint supports TS7.
    # See: typescript-eslint#12518
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]

  # GitHub Actions versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
